# Raspberry Pi Configuration
# Tuned for the on-robot deployment (ReSpeaker mic array + limited CPU)
#
# All nodes run under the /voice namespace (see launch files), so node keys use
# the /**/ wildcard prefix to match regardless of namespace.

# ========== SERVER NODES ==========

/**/backend_manager_node:
  ros__parameters:
    preferred_backend: "openai_realtime"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

/**/asr_node:
  ros__parameters:
    model_size: "medium"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 8
    initial_prompt: "A bilingual conversation in Romanian and English."

/**/llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20
    sticky_speaker_timeout_s: 180.0

/**/tts_node:
  ros__parameters:
    voice_en: "en-GB-RyanNeural"
    voice_ro: "ro-RO-EmilNeural"
    buffer_size: 2
    rate: "+0%"
    volume: "+0%"

/**/openai_realtime_node:
  ros__parameters:
    # gpt-realtime-2.1 = newest + best speech-to-speech (reasoning + tool use).
    # Audio $32/$64 per 1M tokens (~$0.05/min). Swap to "gpt-realtime-2.1-mini"
    # ($10/$20 per 1M, ~$0.016/min) for cheap continuous running on the robot.
    model: "gpt-realtime-2.1"
    voice: "cedar"
    api_base_url: "wss://api.openai.com/v1/realtime"
    # Transcription of the USER's audio (drives command matching + turn filters).
    # gpt-4o-mini-transcribe mangled command phrases and free-guessed languages.
    input_transcription_model: "gpt-4o-transcribe"
    input_transcription_language: ""   # empty = auto (this stack is bilingual RO/EN)
    input_sample_rate: 16000
    api_sample_rate: 24000
    reasoning_enabled: true
    reasoning_effort: "medium"
    wait_for_user_tool_enabled: true
    vad_threshold: 0.70
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 700
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    # This node owns turn-taking: attention focus, diarization policy and the
    # wait_for_user tool all decide per turn whether to answer. It therefore
    # disables the Realtime API's own auto-response (turn_detection.create_response),
    # which would otherwise answer first and cause a double reply.
    # Set false to hand turn-taking back to the server (loses the local gating).
    local_response_gating: true
    playback_input_filter_enabled: true
    playback_input_filter_post_playback_ms: 1400
    playback_input_filter_min_rms_dbfs: -24.0
    playback_input_filter_hits_required: 2
    playback_input_filter_hold_ms: 300
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 10.0
    assistant_echo_similarity_threshold: 84.0
    web_search_enabled: true
    web_search_model: "gpt-4.1"
    web_search_context_size: "medium"
    # Tools: emotion reporting, speaker lookup, name capture, pause/resume by intent
    emotion_tool_enabled: true
    speaker_info_tool_enabled: true
    name_capture_tool_enabled: true
    pause_tool_enabled: true
    # Local fillers mask response latency (needs voices/fillers/*.wav)
    enable_local_fillers: false
    filler_chance: 0.75
    filler_volume: 0.80
    filler_delay_ms: 2000
    # DOA (ReSpeaker direction of arrival) injected as spatial context
    doa_enabled: true
    doa_focus_margin: 120.0
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0
    # Multi-party dialogue: semantic addressing + diarization arbitration
    semantic_addressing_enabled: true
    loud_environment_mode: true
    multi_speaker_window_s: 8.0
    multi_speaker_switch_threshold: 2
    indirect_address_score_threshold: 0.62
    loud_indirect_address_score_threshold: 0.74
    diarization_candidate_timeout_s: 12.0
    diarization_candidate_confidence_threshold: 0.55
    diarization_response_wait_ms: 1200

/**/diarization_assist_node:
  ros__parameters:
    enabled: true
    model: "gpt-4o-transcribe-diarize"
    min_segment_seconds: 1.0
    max_segment_seconds: 24.0
    only_when_unknown: true
    local_speaker_grace_s: 0.35
    cooldown_s: 1.5
    timeout_s: 12.0
    max_reference_speakers: 4
    min_reference_seconds: 1.5
    reference_seconds: 8.0
    min_dominant_share: 0.55

/**/pipecat_audio_node:
  ros__parameters:
    pipecat_log_level: "ERROR"
    verbose_pipeline_logs: false

# ========== CLIENT NODES ==========

/**/audio_capture_node:
  ros__parameters:
    device_index: 3
    respeaker_mode: true
    respeaker_channel: 0
    gain: 1.0
    chunk_ms: 20
    debug_recording: true
    # debug_wav_path is injected by the launch file (workspace_root/openai_debug_mic.wav)

/**/vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14
    energy_threshold: 150

/**/audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0

/**/audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 1.0
    enable_dynamic_volume: true
    # Volume adapts to room noise: -60 dBFS -> min_playback_gain, -25 dBFS -> max.
    # A normal quiet room sits near -58 dBFS, i.e. AT the floor — so min_playback_gain
    # is the everyday operating volume, not an edge case. At 0.15 the robot was
    # whispering at 18% and was effectively inaudible.
    min_playback_gain: 0.55
    max_playback_gain: 1.0
    # Set this to the robot's real speaker sink. Left empty = system default,
    # which the ReSpeaker mic array can hijack (robot goes silent, no error).
    # Discover with:  pactl list sinks short
    output_sink: ""


/**/acoustic_monitor_node:
  ros__parameters:
    monitoring_interval_s: 5.0
    respeaker_vid: 10374 # 0x2886
    respeaker_pid: 24    # 0x0018
    quiet_noise_threshold_dbfs: -48.0
    noisy_noise_threshold_dbfs: -35.0
    enable_respeaker_tuning: true

/**/barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.60
    stop_logit_margin: 0.4
    stop_hits_required: 2
    voice_enabled: true
    min_voice_ms: 300
    min_rms_dbfs: -28.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

/**/speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.40
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16
    # Online voiceprint adaptation: strengthen templates on confident matches.
    enable_voiceprint_adaptation: true
    adapt_min_score: 0.60
    adapt_min_margin: 0.10
    adapt_min_interval_s: 20.0

/**/attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0
    semantic_addressing_enabled: true
    loud_environment_mode: true
    multi_speaker_window_s: 8.0
    multi_speaker_switch_threshold: 2
    indirect_address_score_threshold: 0.62
    loud_indirect_address_score_threshold: 0.74

/**/person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    max_enrollment_segment_age_s: 20.0
    max_enrollment_clip_seconds: 12.0
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.30,goodbye_robot:0.40"

/**/voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

/**/robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    command_topic_enabled: true
    # Gemini architecture: this node is a SAFETY GATE, not an actuator. It
    # validates the command and forwards it to the motion team on the single
    # approved_command_topic bus, then stops. It drives no hardware itself.
    # Everything below (move_mode/cmd_vel_topic/behavior_*/the six services) is
    # INERT while this is true — kept so direct driving can be re-enabled.
    command_topic_only: true
    # Motion-team interfaces are RELATIVE, so they resolve under the /voice
    # namespace too (e.g. /voice/humanoid_command). The motion stack must
    # subscribe with the prefix.
    approved_command_topic: "humanoid_command"
    move_mode: "twist"
    cmd_vel_topic: "cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "robot_behavior_command"
    behavior_action_name: "humanoid_motion"
    behavior_action_timeout_s: 30.0
    raise_hands_service: "raise_hands"
    lower_hands_service: "lower_hands"
    wave_service: "wave"
    dance_service: "dance"
    sit_service: "sit"
    stand_service: "stand"
    preempt_on_new_command: true
    enable_voice_cancel: true
    # Risky-command confirmation is OFF (see params_laptop.yaml for the why):
    # the spoken yes/no could not be received reliably. Commands dispatch
    # immediately; the spoken "stop" cancel below is still active.
    enable_risky_confirmation: false
    confirmation_timeout_s: 12.0
    require_same_speaker_for_confirmation: false
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3

/**/echo_canceller_node:
  ros__parameters:
    filter_length_ms: 100
    step_size: 0.15
    max_delay_ms: 900
    mic_gain: 1.0
    capture_gain: 1.0            # Trebuie sincronizat cu audio_capture_node.gain
    playback_gain: 1.0           # Trebuie sincronizat cu audio_playback_node.gain
    debug_recording: true
    # raw_wav_path, ref_wav_path, clean_wav_path are injected by the launch file
    # DeepFilterNet Settings
    deep_filter_enabled: true
    deep_filter_post_filter: true
    deep_filter_atten_lim_db: 25.0
    deep_filter_dynamic_adaptation: true
    webrtc_ns_level: 1
    webrtc_ns_enabled: true
    residual_gate_enabled: true
    residual_gate_rms_threshold: 1400
