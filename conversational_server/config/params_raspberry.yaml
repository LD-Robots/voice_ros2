# Raspberry Pi Configuration (Full Sweep)
# Optimized for high-gain, low-threshold barge-in on ReSpeaker 6-Mic

# ========== SERVER NODES ==========

backend_manager_node:
  ros__parameters:
    preferred_backend: "gemini_live"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

asr_node:
  ros__parameters:
    model_size: "medium"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 8
    initial_prompt: "A bilingual conversation in Romanian and English."

llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20
    sticky_speaker_timeout_s: 180.0

tts_node:
  ros__parameters:
    voice_en: "en-GB-RyanNeural"
    voice_ro: "ro-RO-EmilNeural"
    buffer_size: 1
    rate: "+0%"
    volume: "+0%"


# ========== CLIENT NODES ==========

audio_capture_node:
  ros__parameters:
    device_index: 3
    respeaker_mode: true
    respeaker_channel: 0
    gain: 1.0              # 3.0 when inside head (needs amplification), 1.0 when outside (avoid clipping)
    # gain: 3.0            # (Uncomment this line when microphone is mounted inside the head)
    chunk_ms: 20
    debug_recording: true
    debug_wav_path: "debug_mic_capture.wav"

vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14
    energy_threshold: 150

audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0

audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 1.0

barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.60
    stop_logit_margin: 0.3
    stop_hits_required: 1
    voice_enabled: true
    min_voice_ms: 600
    min_rms_dbfs: -50.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.45
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16

attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0

person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.30,goodbye_robot:0.40"

voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    move_mode: "twist"
    cmd_vel_topic: "/cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "/robot_behavior_command"
    raise_hands_service: "/raise_hands"
    dance_service: "/dance"
    preempt_on_new_command: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3
    
echo_canceller_node:
  ros__parameters:
    raw_wav_path: "aec_raw.wav"
    ref_wav_path: "aec_reference.wav"
    clean_wav_path: "aec_cleaned.wav"
    debug_recording: true
