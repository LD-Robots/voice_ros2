# Raspberry Pi Configuration (Full Sweep)
# Optimized for high-gain, low-threshold barge-in on ReSpeaker 6-Mic

# ========== SERVER NODES ==========

backend_manager_node:
  ros__parameters:
    preferred_backend: "openai_realtime"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

asr_node:
  ros__parameters:
    model_size: "medium"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 8
    initial_prompt: "A bilingual conversation in Romanian and English."

llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20

tts_node:
  ros__parameters:
    voice_en: "en-GB-RyanNeural"
    voice_ro: "ro-RO-EmilNeural"
    buffer_size: 1
    rate: "+0%"
    volume: "+0%"

openai_realtime_node:
  ros__parameters:
    model: "gpt-realtime-mini"
    voice: "cedar"
    api_base_url: "wss://api.openai.com/v1/realtime"
    input_sample_rate: 16000
    api_sample_rate: 24000
    input_transcription_model: "gpt-4o-transcribe"
    force_language: "en"
    vad_threshold: 0.82
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 550
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true
    playback_input_filter_post_playback_ms: 1300
    playback_input_filter_min_rms_dbfs: -21.0
    playback_input_filter_leak_margin_db: 12.0
    playback_input_filter_hits_required: 5
    playback_input_filter_hold_ms: 260
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 10.0
    assistant_echo_similarity_threshold: 84.0
    web_search_enabled: true
    web_search_model: "gpt-4.1"
    web_search_context_size: "medium"
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true

# ========== CLIENT NODES ==========

audio_capture_node:
  ros__parameters:
    device_index: 3
    respeaker_mode: true
    respeaker_channel: 0
    gain: 1.2
    chunk_ms: 60
    respeaker_tuning_enabled: true
    respeaker_vendor_id: 10374   # 0x2886
    respeaker_product_id: 24      # 0x0018 (XVF3000 USB array control interface)
    respeaker_tuning_profile: "voice_assistant"
    respeaker_tuning_overrides: "GAMMAVAD_SR=3.5,HPFONOFF=3"
    respeaker_doa_poll_interval_s: 1.0
    output_guard_enabled: true
    output_guard_duck_gain: 0.25
    output_guard_post_duck_gain: 0.50
    output_guard_hold_ms: 450
    respeaker_ref_guard_enabled: true
    respeaker_ref_guard_reference_channel: 5
    respeaker_ref_guard_min_ref_dbfs: -40.0
    respeaker_ref_guard_corr_threshold: 0.82
    respeaker_ref_guard_user_ratio: 1.40
    respeaker_ref_guard_duck_gain: 0.10
    respeaker_ref_guard_log_interval_ms: 2500

vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14

audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0

audio_playback_node:
  ros__parameters:
    sample_rate: 16000

barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.60
    stop_logit_margin: 0.3
    stop_hits_required: 1
    voice_enabled: true
    min_voice_ms: 380
    min_rms_dbfs: -31.0
    leak_margin_db: 8.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.45
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16

attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true

person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2

conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2

wake_word_node:
  ros__parameters:
    threshold: 0.35
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.22,goodbye_robot:0.30"
    ack_on_retrigger: true

voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    move_mode: "twist"
    cmd_vel_topic: "/cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "/robot_behavior_command"
    raise_hands_service: "/raise_hands"
    dance_service: "/dance"
    preempt_on_new_command: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3
