# Raspberry Pi Configuration (Full Sweep)
# Optimized for high-gain, low-threshold barge-in on ReSpeaker 6-Mic

# ========== SERVER NODES ==========

backend_manager_node:
  ros__parameters:
    preferred_backend: "legacy"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

asr_node:
  ros__parameters:
    provider: "elevenlabs"
    model_size: "medium"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 8
    initial_prompt: "A multilingual spoken conversation. Preserve the user's current language unless they clearly switch."
    eleven_model_id: "scribe_v2"
    eleven_diarize: true
    eleven_num_speakers: 0
    eleven_diarization_threshold: 0.18
    eleven_tag_audio_events: false
    eleven_prefer_raw_pcm: true
    eleven_min_diarized_words: 2
    eleven_allowed_language_codes: "en,eng,ro,ron,rum"

llm_node:
  ros__parameters:
    provider: "openai"
    model: "gpt-5.5"
    fast_model_enabled: true
    fast_model: "gpt-5-mini"
    fast_reasoning_effort: "minimal"
    reasoning_effort: "low"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20
    prebuffer_chars: 45
    soft_max_chars: 95
    max_idle_ms: 120
    backchannel_enabled: false
    websearch_enabled: true
    websearch_provider: "brave"
    search_router_enabled: true
    search_router_model: "gpt-5-mini"
    search_router_reasoning_effort: "minimal"
    brave_search_country: "ALL"
    brave_search_lang: "en"
    brave_search_count: 5
    brave_llm_context_enabled: true
    brave_llm_context_count: 8
    brave_llm_context_max_tokens: 8192

tts_node:
  ros__parameters:
    provider: "elevenlabs"
    eleven_model_id: "eleven_v3"
    eleven_voice_id_en: "vBKc2FfBKJfcZNyEt1n6"
    eleven_voice_id_ro: "vBKc2FfBKJfcZNyEt1n6"
    eleven_output_format: "pcm_16000"
    eleven_latency_optimization: -1
    eleven_stream_pcm_chunks: true
    eleven_stream_chunk_ms: 100
    eleven_stability: 0.42
    eleven_similarity_boost: 0.78
    eleven_style: 0.38
    eleven_use_speaker_boost: true
    fallback_to_edge: true
    voice_en: "en-GB-RyanNeural"
    voice_ro: "ro-RO-EmilNeural"
    buffer_size: 1
    rate: "+0%"
    volume: "+0%"

openai_realtime_node:
  ros__parameters:
    model: "gpt-realtime-mini"
    voice: "cedar"
    api_base_url: "wss://api.openai.com/v1/realtime"
    input_sample_rate: 16000
    api_sample_rate: 24000
    vad_threshold: 0.70
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 550
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true
    playback_input_filter_post_playback_ms: 1400
    playback_input_filter_min_rms_dbfs: -24.0
    playback_input_filter_hits_required: 2
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 10.0
    assistant_echo_similarity_threshold: 84.0
    web_search_enabled: true
    web_search_provider: "brave"
    web_search_model: "gpt-4.1"
    web_search_context_size: "medium"
    brave_search_country: "ALL"
    brave_search_lang: "en"
    brave_search_count: 5
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true

# ========== CLIENT NODES ==========

audio_capture_node:
  ros__parameters:
    device_index: 3
    respeaker_mode: true
    respeaker_channel: 0
    gain: 1.0
    chunk_ms: 60

vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 10
    capture_during_playback: true

audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0
    pre_buffer_seconds: 0.4
    capture_during_playback: true
    stop_playback_on_voice_start: true

audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 1.0

barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.60
    stop_logit_margin: 0.3
    stop_hits_required: 1
    voice_enabled: true
    min_voice_ms: 600
    min_rms_dbfs: -50.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.45
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16

attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    llm_address_router_enabled: true
    llm_address_router_model: "gpt-5-mini"
    llm_address_router_reasoning_effort: "medium"
    llm_address_router_timeout_s: 8.0
    llm_address_router_fail_closed: true
    llm_address_router_recent_turns: 8
    assistant_question_reply_window_s: 25.0
    initial_session_reply_grace_s: 30.0
    attention_learning_enabled: true
    attention_learning_rate: 0.08
    attention_learning_threshold: 0.58
    attention_learning_min_confidence: 0.18
    attention_learning_path: "voices/attention_policy.json"
    attention_learning_llm_teacher_scale: 0.25
    attention_learning_route_enabled: false

person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2

conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2

wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.30,goodbye_robot:0.40"

voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    move_mode: "twist"
    cmd_vel_topic: "/cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "/robot_behavior_command"
    handshake_service: "/handshake"
    raise_hands_service: "/raise_hands"
    dance_service: "/dance"
    preempt_on_new_command: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3
