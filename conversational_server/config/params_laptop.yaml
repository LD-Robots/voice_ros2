# Laptop Configuration (Full Sweep)
# Optimized for general testing with ReSpeaker support

# ========== SERVER NODES ==========

backend_manager_node:
  ros__parameters:
    preferred_backend: "openai_realtime"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

asr_node:
  ros__parameters:
    provider: "mistral_realtime"
    model_size: "small"
    device: "cpu"
    compute_type: "int8"
    min_audio_length: 0.35
    language: "ro_en"
    beam_size: 5
    initial_prompt: "A bilingual conversation in Romanian and English."
    ignore_during_playback: true
    playback_guard_post_ms: 2200
    echo_recent_playback_window_s: 12.0
    echo_recent_playback_threshold: 68
    mistral_api_key_env: "VOXTRAL_API_KEY"
    mistral_realtime_model: "voxtral-mini-realtime-latest"
    mistral_batch_fallback_model: "voxtral-mini-latest"
    mistral_use_batch_fallback: true
    mistral_timeout_ms: 25000
    mistral_target_streaming_delay_ms: 120
    mistral_chunk_ms: 80

llm_node:
  ros__parameters:
    provider: "mistral"
    model: "mistral-small-latest"
    max_tokens: 100
    temperature: 0.70
    min_chunk_chars: 20
    websearch_enabled: false
    mistral_api_key_env: "VOXTRAL_API_KEY"
    mistral_prompt_mode: "chat"
    mistral_reasoning_effort: "none"
    mistral_timeout_s: 35.0
    mistral_include_thinking_chunks: false
    assistant_echo_filter_enabled: true
    assistant_echo_similarity_threshold: 84.0
    assistant_echo_min_chars: 10
    legacy_playback_guard_enabled: true
    legacy_playback_guard_post_ms: 2200

tts_node:
  ros__parameters:
    provider: "voxtral"
    provider_fallback_edge: true
    voxtral_api_key_env: "VOXTRAL_API_KEY"
    voxtral_model: "voxtral-mini-tts-latest"
    voxtral_response_format: "wav"
    voxtral_timeout_s: 20.0
    voxtral_voice_id_en: ""
    voxtral_voice_id_ro: ""
    voxtral_ref_audio_en_path: "conversational_server/resources/static_audio/ack_en.wav"
    voxtral_ref_audio_ro_path: "conversational_server/resources/static_audio/ack_en.wav"
    voxtral_use_ref_audio_if_no_voice: true
    voice_en: "en-IE-EmilyNeural"
    voice_ro: "ro-RO-AlinaNeural"
    buffer_size: 2
    rate: "+0%"
    volume: "+0%"

openai_realtime_node:
  ros__parameters:
    model: "gpt-realtime-mini"
    voice: "cedar"
    api_base_url: "wss://api.openai.com/v1/realtime"
    input_sample_rate: 16000
    api_sample_rate: 24000
    vad_threshold: 0.70
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 550
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true
    playback_input_filter_post_playback_ms: 800
    playback_input_filter_min_rms_dbfs: -14.0
    playback_input_filter_hits_required: 2
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 8.0
    assistant_echo_similarity_threshold: 84.0
    web_search_enabled: true
    web_search_model: "gpt-4o-mini"
    web_search_context_size: "medium"
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true

# ========== CLIENT NODES ==========

audio_capture_node:
  ros__parameters:
    device_index: -1       # -1 = auto-detect (ReSpeaker will be found automatically)
    respeaker_mode: false  # not needed: 1-channel firmware outputs mono natively
    respeaker_channel: 0
    stereo_mono_extract: false
    gain: 1.0
    chunk_ms: 60

vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14
    use_hardware_vad: true
    capture_during_playback: true

audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.35
    max_segment_seconds: 30.0

audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 0.5
    force_os_volume_percent: 80
    speaking_grace_period_s: 2.5
barge_in_node:
  ros__parameters:
    stop_enabled: true
    stop_prob_threshold: 0.80
    stop_logit_margin: 0.5
    stop_hits_required: 2
    voice_enabled: true
    min_voice_ms: 240
    min_rms_dbfs: -24.0
    max_dynamic_rms_dbfs: -16.0
    leak_margin_db: 2.5
    highpass_hz: 300.0
    zcr_min: 0.02
    zcr_max: 0.45

speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.45
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16

attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true

person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2

conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2

wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.30,goodbye_robot:0.40"

voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    move_mode: "twist"
    cmd_vel_topic: "/cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "/robot_behavior_command"
    raise_hands_service: "/raise_hands"
    dance_service: "/dance"
    preempt_on_new_command: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3
