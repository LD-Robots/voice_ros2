# Laptop Configuration (Full Sweep)
# Optimized for general testing with ReSpeaker support

# ========== SERVER NODES ==========

/**/backend_manager_node:
  ros__parameters:
    preferred_backend: "gemini_live"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

/**/asr_node:
  ros__parameters:
    model_size: "small"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 5
    initial_prompt: "A bilingual conversation in Romanian and English."

/**/llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20
    sticky_speaker_timeout_s: 180.0

/**/tts_node:
  ros__parameters:
    voice_en: "en-IE-EmilyNeural"
    voice_ro: "ro-RO-AlinaNeural"
    buffer_size: 2
    rate: "+0%"
    volume: "+0%"


/**/gemini_live_node:
  ros__parameters:
    model: "gemini-2.5-flash-native-audio-latest"
    voice: "Charon" #"Charon" - masculine voice (calm, mature), "Puck" - masculine voice (friendly, energetic), "Aoede" - feminine voice (dynamic, vibrant)
    input_sample_rate: 16000
    api_sample_rate: 24000
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 600
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true  # Filtru software anti-echo rezidual (dupa AEC WebRTC+DeepFilterNet)
    playback_input_filter_post_playback_ms: 200   # Fereastra de protectie dupa stop playback (redusa pentru barge-in rapid)
    playback_input_filter_min_rms_dbfs: -28.0     # Ridicat de la -32: ignora ecoul rezidual, prinde doar vocea ta (care acum e mai tare)
    playback_input_filter_hits_required: 2         # Hits necesare pentru a deschide gate-ul (era 3)
    playback_input_filter_hold_ms: 300             # Gate ramas deschis 300ms dupa ultimul hit de voce
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 8.0
    assistant_echo_similarity_threshold: 84.0
    google_search_enabled: true
    doa_enabled: false
    doa_focus_margin: 120.0
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0

# ========== CLIENT NODES ==========

/**/audio_capture_node:
  ros__parameters:
    device_index: 3       # -1 = auto-detect (ReSpeaker will be found automatically)
    respeaker_mode: false  # not needed: 1-channel firmware outputs mono natively
    respeaker_channel: 0
    stereo_mono_extract: true
    gain: 3.0              # 3.0 when inside head (needs amplification), 1.0 when outside (avoid clipping)
    chunk_ms: 20
    debug_recording: true
    # debug_wav_path is injected by the launch file (workspace_root/gemini_debug_mic.wav)

/**/vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14
    use_hardware_vad: false
    energy_threshold: 150
    aggressiveness: 3

/**/audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0
    capture_during_playback: true

/**/audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 0.5
    force_os_volume_percent: 80
/**/barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.80
    stop_logit_margin: 0.5
    stop_hits_required: 2
    voice_enabled: true
    min_voice_ms: 600
    min_rms_dbfs: -7.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

/**/speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.30
    similarity_margin: 0.08
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16
    unsupervised_enrollment_enabled: false

/**/attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0

/**/person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: false
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    # custom_models is injected by the launch file (package share models directory)
    model_thresholds: "hello_robot:0.20,goodbye_robot:0.60"

/**/voice_command_node:
  ros__parameters:
    command_topic: "recognized_commands"
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

/**/robot_command_gate_node:
  ros__parameters:
    input_topic: "recognized_commands"
    command_topic: "robot_commands"
    execution_enabled: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_turn_angle_deg: 150.0

/**/echo_canceller_node:
  ros__parameters:
    filter_length_ms: 100         # Increased to cover laptop reflections
    step_size: 0.15              # A bit more aggressive
    max_delay_ms: 400            # Real physical latency is ~100-300ms; keeping it small prevents false correlation peaks in speech
    playback_gain: 0.5           # SYNC cu audio_playback_node.gain: 0.5 (referinta AEC la amplitudinea corecta)
    capture_gain: 3.0            # SYNC cu audio_capture_node.gain: 3.0 (reflecta amplificarea microfonului in referinta)
    mic_gain: 1.0                # Post-AEC amplification (1.0 = off; amplificarea e acum inclusa in formula referintei)
    debug_recording: true
    # raw_wav_path, ref_wav_path, clean_wav_path are injected by the launch file
    # DeepFilterNet Settings
    deep_filter_enabled: false   # Dezactivat: DF nu face AEC, conserva vocea robotului in output
    webrtc_ns_level: 3           # Crescut la 3 (max) pentru supresie suplimentara a reziduidelor post-AEC
    webrtc_ns_enabled: true      # Enabled to keep noise floor low so Gemini Live VAD detects turn end
    # Residual gate: zeroes out low-amplitude AEC residuals during/after robot playback.
    # Human barge-in voice (louder) passes through; robot echo fragments (quiet) are gated.
    residual_gate_enabled: true
    residual_gate_rms_threshold: 800  # int16 RMS threshold (~-32 dBFS). Increase if residues still audible, decrease if barge-in is cut.
