# Laptop Configuration (Full Sweep)
# Optimized for general testing with ReSpeaker support

# ========== SERVER NODES ==========

/**/backend_manager_node:
  ros__parameters:
    preferred_backend: "gemini_live"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

/**/asr_node:
  ros__parameters:
    model_size: "small"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 5
    initial_prompt: "A bilingual conversation in Romanian and English."

/**/llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20
    sticky_speaker_timeout_s: 180.0

/**/tts_node:
  ros__parameters:
    voice_en: "en-IE-EmilyNeural"
    voice_ro: "ro-RO-AlinaNeural"
    buffer_size: 2
    rate: "+0%"
    volume: "+0%"


/**/gemini_live_node:
  ros__parameters:
    model: "gemini-2.5-flash-native-audio-latest"
    voice: "Charon" #"Charon" - masculine voice (calm, mature), "Puck" - masculine voice (friendly, energetic), "Aoede" - feminine voice (dynamic, vibrant)
    input_sample_rate: 16000
    api_sample_rate: 16000
    gemini_fillers_enabled: false  # Gemini calls play_thinking_sound() when it needs time to think (disabled)
    filler_volume: 0.80
    fillers_dir: "voices/fillers"
    greeting_repeat_window_s: 600.0
    vad_prefix_padding_ms: 300
    vad_silence_duration_ms: 600  # Increased from 350 to 700ms: prevents premature turnComplete on short sentences or continuations
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true  # Software residual-echo filter (applied after WebRTC AEC + DeepFilterNet)
    playback_input_filter_post_playback_ms: 200   # Protection window after stop-playback (reduced for faster barge-in response)
    playback_input_filter_min_rms_dbfs: -28.0     # Lowered to -28 dBFS: allows quieter voice to pass through to Gemini
    playback_input_filter_hits_required: 2         # Requires 2 consecutive real-voice frames (avoids short spikes)
    playback_input_filter_hold_ms: 300             # Gate stays open 300ms after the last voice hit
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 8.0
    assistant_echo_similarity_threshold: 84.0
    google_search_enabled: true
    doa_enabled: false
    doa_focus_margin: 120.0
    # Speaker-change reconnects are persona refreshes, not errors: reopen fast
    # and debounce transient ID flips (see #1/#3 speaker-recognition fixes).
    intentional_reconnect_delay_s: 0.3
    speaker_reconnect_debounce_s: 6.0
    name_capture_tool_enabled: true
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0
    force_response_on_silent_turn: true
    silent_turn_delay_s: 3.0

# ========== CLIENT NODES ==========

/**/audio_capture_node:
  ros__parameters:
    device_index: -1       # -1 = auto-detect (ReSpeaker will be found automatically)
    respeaker_mode: false  # not needed: 1-channel firmware outputs mono natively
    respeaker_channel: 0
    stereo_mono_extract: true
    gain: 3.0              # 3.0 when inside head (needs amplification), 1.0 when outside (avoid clipping)
    chunk_ms: 20
    debug_recording: true
    # debug_wav_path is injected by the launch file (workspace_root/gemini_debug_mic.wav)

/**/vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    # Engine selection: "silero" (deep learning, best), "webrtc" (legacy), "hardware", "energy"
    vad_engine: "silero"
    # Silero VAD parameters (only used when vad_engine=silero)
    silero_activation_threshold: 0.5    # Speech confidence (0.0-1.0). Lower = more sensitive, higher = stricter
    silero_min_speech_duration_ms: 50   # Ignore sounds shorter than this (filters coughs, clicks)
    silero_min_silence_duration_ms: 550 # Hangover: wait this long after silence before declaring speech ended

/**/audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0
    capture_during_playback: true

/**/audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 0.5
    enable_dynamic_volume: true
    min_playback_gain: 0.15
    max_playback_gain: 1.0
/**/acoustic_monitor_node:
  ros__parameters:
    monitoring_interval_s: 5.0
    respeaker_vid: 10374 # 0x2886
    respeaker_pid: 24    # 0x0018
    quiet_noise_threshold_dbfs: -48.0
    noisy_noise_threshold_dbfs: -35.0
    enable_respeaker_tuning: false
    state_hysteresis_db: 2.0    # Noise must exceed threshold by this many dB before a state change is allowed
    min_state_dwell_s: 10.0     # Minimum seconds to stay in a state before allowing a transition
/**/barge_in_node:
  ros__parameters:
    voice_enabled: true
    min_voice_ms: 300          # Reduced from 600ms: faster barge-in trigger (300ms = 15 frames)
    min_rms_dbfs: -28.0        # Synchronized with gemini_live_node (-28.0 dBFS) for uniform barge-in sensitivity
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

/**/speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.30
    similarity_margin: 0.08
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16
    unsupervised_enrollment_enabled: false
    # Online voiceprint adaptation: strengthen templates on confident matches.
    enable_voiceprint_adaptation: true
    adapt_min_score: 0.60
    adapt_min_margin: 0.10
    adapt_min_interval_s: 20.0

/**/attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    sticky_speaker_timeout_s: 180.0

/**/person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    # Gemini transcripts lag the audio; keep this well above that latency or
    # real self-introductions get rejected as "segment too old".
    max_enrollment_segment_age_s: 20.0
    max_enrollment_clip_seconds: 12.0
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    sticky_speaker_timeout_s: 180.0

/**/wake_word_node:
  ros__parameters:
    threshold: 0.5
    quiet_threshold_offset: -0.15
    noisy_threshold_offset: 0.15
    cooldown_ms: 1500
    # custom_models is injected by the launch file (package share models directory)
    model_thresholds: "hello_robot:0.20,goodbye_robot:0.60"

/**/voice_command_node:
  ros__parameters:
    command_topic: "recognized_commands"
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

/**/robot_command_gate_node:
  ros__parameters:
    input_topic: "recognized_commands"
    command_topic: "robot_commands"
    execution_enabled: true
    enable_voice_cancel: true
    # Risky-command confirmation is OFF: the spoken yes/no could not be received
    # reliably (Gemini transcribed "yes" into other scripts, e.g. Devanagari
    # "यस", which the unsupported_script filter drops, and the transcript often
    # arrived after confirmation_timeout_s). All 5 commands now dispatch
    # immediately. The spoken "stop" cancel below is still active.
    # Set back to true to re-enable the confirmation gate.
    enable_risky_confirmation: false
    confirmation_timeout_s: 12.0
    require_same_speaker_for_confirmation: false
    risky_steps_threshold: 5
    risky_turn_angle_deg: 150.0

/**/echo_canceller_node:
  ros__parameters:
    filter_length_ms: 100         # Increased to cover laptop reflections
    step_size: 0.15              # A bit more aggressive
    max_delay_ms: 900            # Increased to 900ms: real measured delay is ~703ms (11248 samples @ 16kHz)
    mic_gain: 1.0                # Post-AEC amplification (1.0 = off; gain is now baked into the reference formula)
    debug_recording: true
    # raw_wav_path, ref_wav_path, clean_wav_path are injected by the launch file
    # DeepFilterNet Settings
    deep_filter_enabled: true    # Active: neural filtering with post-filtering and dynamic adaptation
    deep_filter_post_filter: true # Spectral post-filtering for aggressive suppression of echo/reverberation tails (RT60)
    deep_filter_atten_lim_db: 15.0 # Attenuation limit in dB (milder to preserve user voice during barge-in)
    deep_filter_dynamic_adaptation: true # Dynamic scaling of the attenuation limiter based on acoustic state
    webrtc_ns_level: 1           # Reduced to 1 (gentle) to avoid cutting weak syllables
    webrtc_ns_enabled: true      # Re-enabled for background noise reduction
    # Residual gate: zeroes out low-amplitude AEC residuals during/after robot playback.
    residual_gate_enabled: true
    residual_gate_rms_threshold: 700  # Optimized to 700 RMS to prevent clipping user voice during barge-in
