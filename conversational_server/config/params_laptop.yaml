# Laptop Configuration (Full Sweep)
# Optimized for general testing with ReSpeaker support

# ========== SERVER NODES ==========

backend_manager_node:
  ros__parameters:
    preferred_backend: "openai_realtime"
    fallback_backend: "legacy"
    offline_timeout_s: 1000.0
    auto_return_to_preferred: true

asr_node:
  ros__parameters:
    model_size: "small"
    device: "cpu"
    compute_type: "int8"
    language: "ro_en"
    beam_size: 5
    initial_prompt: "A bilingual conversation in Romanian and English."

llm_node:
  ros__parameters:
    provider: "groq"
    model: "llama-3.1-8b-instant"
    max_tokens: 150
    temperature: 0.7
    min_chunk_chars: 20

tts_node:
  ros__parameters:
    voice_en: "en-IE-EmilyNeural"
    voice_ro: "ro-RO-AlinaNeural"
    buffer_size: 2
    rate: "+0%"
    volume: "+0%"

openai_realtime_node:
  ros__parameters:
    model: "gpt-realtime-2"
    voice: "cedar"
    api_base_url: "wss://api.openai.com/v1/realtime"
    input_sample_rate: 16000
    api_sample_rate: 24000
    reasoning_enabled: true
    reasoning_effort: "medium"
    wait_for_user_tool_enabled: true
    vad_threshold: 0.80
    vad_prefix_padding_ms: 400
    vad_silence_duration_ms: 600
    response_create_delay_ms: 100
    continued_turn_response_delay_ms: 450
    short_transcript_dedupe_window_s: 4.0
    playback_input_filter_enabled: true
    playback_input_filter_post_playback_ms: 800
    playback_input_filter_min_rms_dbfs: -35.0
    playback_input_filter_hits_required: 3
    assistant_echo_filter_enabled: true
    assistant_echo_window_s: 8.0
    assistant_echo_similarity_threshold: 84.0
    web_search_enabled: true
    web_search_model: "gpt-4o-mini"
    web_search_context_size: "medium"
    capture_during_playback: true
    speaker_switch_hits_required: 2
    language_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    semantic_addressing_enabled: true
    loud_environment_mode: true
    multi_speaker_window_s: 8.0
    multi_speaker_switch_threshold: 2
    indirect_address_score_threshold: 0.62
    loud_indirect_address_score_threshold: 0.74
    diarization_candidate_timeout_s: 12.0
    diarization_candidate_confidence_threshold: 0.55
    diarization_response_wait_ms: 1200

diarization_assist_node:
  ros__parameters:
    enabled: true
    model: "gpt-4o-transcribe-diarize"
    min_segment_seconds: 1.0
    max_segment_seconds: 24.0
    only_when_unknown: true
    local_speaker_grace_s: 0.35
    cooldown_s: 1.5
    timeout_s: 12.0
    max_reference_speakers: 4
    min_reference_seconds: 1.5
    reference_seconds: 8.0
    min_dominant_share: 0.55

pipecat_audio_node:
  ros__parameters:
    pipecat_log_level: "ERROR"
    verbose_pipeline_logs: false

# ========== CLIENT NODES ==========

audio_capture_node:
  ros__parameters:
    device_index: -1       # -1 = auto-detect (ReSpeaker will be found automatically)
    respeaker_mode: false  # not needed: 1-channel firmware outputs mono natively
    respeaker_channel: 0
    stereo_mono_extract: true
    gain: 1.0
    chunk_ms: 60
    debug_recording: true
    debug_wav_path: "/tmp/debug_mic_capture.wav"

vad_node:
  ros__parameters:
    wake_word_enabled: true
    session_timeout: 30.0
    min_silence_frames: 14
    use_hardware_vad: false

audio_segment_node:
  ros__parameters:
    min_segment_seconds: 0.5
    max_segment_seconds: 30.0

audio_playback_node:
  ros__parameters:
    sample_rate: 16000
    gain: 0.5
    force_os_volume_percent: 80
barge_in_node:
  ros__parameters:
    stop_enabled: false
    stop_prob_threshold: 0.80
    stop_logit_margin: 0.5
    stop_hits_required: 2
    voice_enabled: true
    min_voice_ms: 600
    min_rms_dbfs: -7.0
    highpass_hz: 300.0
    zcr_min: 0.05
    zcr_max: 0.35

speaker_id_node:
  ros__parameters:
    similarity_threshold: 0.45
    similarity_margin: 0.12
    enrollment_reuse_threshold: 0.58
    enrollment_reuse_margin: 0.16

attention_manager_node:
  ros__parameters:
    speaker_switch_hits_required: 2
    allow_known_speaker_switch_without_address: true
    semantic_addressing_enabled: true
    loud_environment_mode: true
    multi_speaker_window_s: 8.0
    multi_speaker_switch_threshold: 2
    indirect_address_score_threshold: 0.62
    loud_indirect_address_score_threshold: 0.74

person_memory_store_node:
  ros__parameters:
    auto_enroll_unknown_speakers: true
    min_enrollment_segment_seconds: 1.2
    speaker_switch_hits_required: 2

conversation_control_node:
  ros__parameters:
    speaker_switch_hits_required: 2

wake_word_node:
  ros__parameters:
    threshold: 0.5
    cooldown_ms: 1500
    model_thresholds: "hello_robot:0.30,goodbye_robot:0.75"

voice_command_node:
  ros__parameters:
    min_transcription_confidence: 0.45
    default_steps: 1
    max_steps: 20
    enable_tts_ack: false

robot_command_executor_node:
  ros__parameters:
    execution_enabled: true
    command_topic_enabled: true
    command_topic_only: false
    approved_command_topic: "/humanoid_command"
    move_mode: "twist"
    cmd_vel_topic: "/cmd_vel"
    behavior_mode: "topic"
    behavior_topic: "/robot_behavior_command"
    behavior_action_name: "/humanoid_motion"
    behavior_action_timeout_s: 30.0
    raise_hands_service: "/raise_hands"
    lower_hands_service: "/lower_hands"
    wave_service: "/wave"
    dance_service: "/dance"
    sit_service: "/sit"
    stand_service: "/stand"
    preempt_on_new_command: true
    enable_voice_cancel: true
    enable_risky_confirmation: true
    confirmation_timeout_s: 12.0
    risky_steps_threshold: 5
    risky_backward_steps_threshold: 3

echo_canceller_node:
  ros__parameters:
    filter_length_ms: 100         # Crescut pentru a acoperi reflexiile din laptop
    step_size: 0.15              # Putin mai agresiv
    max_delay_ms: 3000           # Crescut la 3 secunde pentru a acoperi latenta extrema
    debug_recording: true
    raw_wav_path: "/tmp/aec_raw.wav"
    ref_wav_path: "/tmp/aec_reference.wav"
    clean_wav_path: "/tmp/aec_cleaned.wav"
    
    # DeepFilterNet Settings
    deep_filter_enabled: true
    deep_filter_attenuation: 100  # Percentage of noise reduction (0-100)
